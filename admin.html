<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.workers.dev https://*.hookmaster.guru; frame-src https://*.firebaseapp.com https://accounts.google.com https://www.facebook.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard — HookMaster</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/jpeg" href="images/logo.jpg">
  <style>
    body { padding: 90px 16px 60px; }
    .wrap { max-width: 980px; margin: 0 auto; }
    .panel { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); border-radius: 16px; padding: 22px; margin-bottom: 22px; }
    .panel h3 { margin-bottom: 14px; font-weight: 800; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
    label.l { display: block; font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin: 12px 0 6px; }
    textarea.search-input { padding: 10px 14px; font-family: inherit; line-height: 1.4; }
    .row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
    .row video { width: 54px; height: 96px; object-fit: cover; border-radius: 8px; background: #000; }
    .row .grow { flex: 1; min-width: 0; }
    .muted { color: var(--text-muted); font-size: .85rem; }
    .bar { height: 8px; background: rgba(255,255,255,.1); border-radius: 8px; overflow: hidden; margin-top: 8px; display: none; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#7440E4,#EC4899); }
    .msg { margin-top: 12px; font-weight: 600; }
    .ok { color: #4ade80; } .err { color: #f87171; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand"><img src="images/logo.jpg" alt="HookMaster" class="logo-img" width="36" height="36"><span>Hook<span class="gradient-text">Master</span></span></a>
      <div class="navbar-cta"></div>
    </div>
  </nav>

  <div class="wrap" id="app">
    <div class="panel"><p class="muted" id="status">Loading…</p></div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/cloud.js"></script>
  <script>
  const $ = id => document.getElementById(id);
  const app = $('app');
  let role = null, editingId = null;

  async function boot() {
    if (!AUTH_CONFIGURED) { $('status').textContent = 'Firebase is not configured yet. Paste your web config into js/auth.js.'; return; }
    await loadFirebase();
    firebase.auth().onAuthStateChanged(async user => {
      if (!user) {
        app.innerHTML = `<div class="panel" style="text-align:center"><h3>Staff sign-in</h3><p class="muted" style="margin-bottom:14px">Admin and VA accounts only.</p><button class="btn btn-primary" onclick="HookAuth.openModal()">Sign In</button></div>`;
        return;
      }
      if (!user.emailVerified && !(user.providerData[0] || {}).providerId?.includes('google')) {
        app.innerHTML = `<div class="panel"><p>Please verify your email first (use Google sign-in for instant access).</p></div>`; return;
      }
      role = await Cloud.getRole(user);
      if (!role) { app.innerHTML = `<div class="panel"><h3>Access denied</h3><p class="muted">${esc(user.email)} is not a staff account. Ask the admin to add you.</p></div>`; return; }
      render(user);
    });
  }

  function render(user) {
    app.innerHTML = `
      <div class="panel">
        <h3>Staff Dashboard <span class="muted">· ${esc(user.email)} (${role})</span></h3>
        <p class="muted">Upload a 9:16 video hook and publish it straight to the website.</p>
      </div>
      <div class="panel">
        <h3 id="form-title">New hook</h3>
        <form id="hook-form">
          <label class="l">Hook text (US English)</label>
          <input class="search-input" id="f-hook" required maxlength="140" placeholder="Stop scrolling if you want your Reels to blow up">
          
          <div class="grid2">
            <div>
              <label class="l">Tags (comma-separated)</label>
              <input class="search-input" id="f-tags" placeholder="e.g. business, reels, growth, luxury">
            </div>
            <div>
              <label class="l">Views benchmark (optional: blank = random 2-10M)</label>
              <input class="search-input" id="f-views" placeholder="e.g. 3.4M (or leave blank)">
            </div>
          </div>

          <label class="l">Viral Instagram Example URL (Reel / Post)</label>
          <input class="search-input" id="f-instagram" placeholder="https://www.instagram.com/reel/C8.../">
          
          <label class="l">How to use this hook (one step per line — shown on the hook page)</label>
          <textarea class="search-input" id="f-howto" rows="4" placeholder="1. Hook the viewer in first 2-3 seconds&#10;2. Cut straight into your proof&#10;3. Deliver 3 bullet points"></textarea>
          
          <label class="l">Best for (short description / target audience)</label>
          <textarea class="search-input" id="f-desc" rows="2" placeholder="Great for business tips, growth hacks, and educational Reels."></textarea>
          
          <label class="l">Suggested caption / hashtags</label>
          <textarea class="search-input" id="f-caption" rows="2" placeholder="#reels #growth #smallbusiness"></textarea>
          
          <label class="l">Matching AI B-Roll Prompt (optional)</label>
          <textarea class="search-input" id="f-aiprompt" rows="2" placeholder="9:16 vertical video, cinematic luxury office, dark aesthetic, 4k realistic --ar 9:16"></textarea>
          
          <label style="display:flex;gap:8px;align-items:center;font-size:.9rem;margin-top:12px"><input type="checkbox" id="f-published" checked> Published (visible on the website)</label>
          <div style="display:flex;gap:10px;margin-top:16px">
            <button class="btn btn-primary" type="submit" id="btn-save">Publish hook</button>
            <button class="btn btn-secondary" type="button" onclick="resetForm()">Clear</button>
          </div>
          <div class="msg" id="msg"></div>
        </form>
      </div>
      <div class="panel"><h3>Published hooks</h3><div id="list" class="muted">Loading…</div></div>
      ${role === 'admin' ? `
      <div class="panel"><h3>VA accounts</h3>
        <p class="muted" style="margin-bottom:10px">VAs can post and edit hooks. They can’t manage staff.</p>
        <form id="staff-form" style="display:flex;gap:10px;margin-bottom:12px"><input class="search-input" id="staff-email" type="email" required placeholder="va@example.com"><button class="btn btn-primary" type="submit">Add VA</button></form>
        <div id="staff-list"></div>
      </div>` : ''}`;
    resetForm();
    $('hook-form').addEventListener('submit', saveHook);
    loadList();
    if (role === 'admin') { $('staff-form').addEventListener('submit', addStaff); loadStaff(); }
  }

  function resetForm() {
    editingId = null;
    $('hook-form').reset();
    $('form-title').textContent = 'New hook';
    $('btn-save').textContent = 'Publish hook';
    $('f-published').checked = true;
    if ($('f-tags')) $('f-tags').value = '';
    if ($('f-views')) $('f-views').value = '';
    if ($('f-instagram')) $('f-instagram').value = '';
    if ($('f-aiprompt')) $('f-aiprompt').value = '';
    setMsg('');
  }

  function setMsg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }

  async function saveHook(e) {
    e.preventDefault();
    const btn = $('btn-save'); btn.disabled = true;
    try {
      const db = await Cloud.db();
      const existing = editingId ? (await db.collection('hooks').doc(String(editingId)).get()).data() : null;

      let id = editingId;
      if (!id) {
        // Auto-increment sequential ID
        const snap = await db.collection('hooks').get();
        const ids = snap.docs.map(d => Number(d.id) || 0).filter(n => n > 0);
        id = ids.length ? Math.max(...ids) + 1 : 1;
      }

      // Views: random 2-10M if not provided
      let viewsVal = ($('f-views').value || '').trim();
      if (!viewsVal) {
        viewsVal = (Math.floor(Math.random() * 81 + 20) / 10).toFixed(1) + 'M';
      }

      // Tags: parsed from comma-separated string
      const rawTags = ($('f-tags').value || '').trim();
      const tags = rawTags ? rawTags.split(',').map(t => t.trim().toLowerCase()).filter(Boolean) : ['general'];

      const gradients = [
        'linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #0b0b14 100%)',
        'linear-gradient(135deg, #064e3b 0%, #047857 50%, #0b0b14 100%)',
        'linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #0b0b14 100%)',
        'linear-gradient(135deg, #312e81 0%, #4338ca 50%, #0b0b14 100%)',
        'linear-gradient(135deg, #831843 0%, #9d174d 50%, #0b0b14 100%)',
        'linear-gradient(135deg, #78350f 0%, #92400e 50%, #0b0b14 100%)',
        'linear-gradient(135deg, #14532d 0%, #166534 50%, #0b0b14 100%)',
        'linear-gradient(135deg, #581c87 0%, #6b21a8 50%, #0b0b14 100%)',
        'linear-gradient(135deg, #18181b 0%, #27272a 50%, #0b0b14 100%)'
      ];
      const bgGradient = existing?.bgGradient || gradients[Math.floor(Math.random() * gradients.length)];

      const doc = {
        id,
        hook: $('f-hook').value.trim(),
        tags,
        resolution: '1080p Full HD',
        views: viewsVal,
        bgGradient,
        exampleInstagram: $('f-instagram').value.trim(),
        howTo: $('f-howto').value.trim(),
        description: $('f-desc').value.trim(),
        suggestedCaption: $('f-caption').value.trim(),
        aiPrompt: $('f-aiprompt') ? $('f-aiprompt').value.trim() : '',
        published: $('f-published').checked,
        createdAt: existing?.createdAt || Date.now(),
        updatedAt: Date.now(),
        createdBy: existing?.createdBy || firebase.auth().currentUser.email
      };
      await db.collection('hooks').doc(String(id)).set(doc);
      const wasEditing = !!editingId;
      loadList();
      if (!wasEditing) resetForm();
      setMsg('Saved Hook #' + id + '! Live on site now.', 'ok');
    } catch (err) { setMsg(err.message || 'Save failed', 'err'); }
    btn.disabled = false;
  }

  async function loadList() {
    const db = await Cloud.db();
    const snap = await db.collection('hooks').get();
    const items = snap.docs.map(d => d.data()).sort((a, b) => (b.id || 0) - (a.id || 0));
    $('list').innerHTML = items.length ? items.map(h => {
      const tagsText = Array.isArray(h.tags) ? h.tags.map(t => '#' + t).join(' ') : (h.tags || h.niche || '');
      return `
      <div class="row">
        <div style="width:48px;height:64px;border-radius:6px;background:${h.bgGradient || '#1e1b4b'};display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:800;color:#fff;">#${h.id}</div>
        <div class="grow">
          <strong>"${esc(h.hook)}"</strong>
          <div class="muted">${esc(tagsText)} · ${esc(h.views || '')} · ${h.published ? 'published' : 'draft'}</div>
        </div>
        <a class="btn btn-secondary btn-sm" href="hook.html?id=${Number(h.id)}" target="_blank">View</a>
        <button class="btn btn-secondary btn-sm" onclick="editHook(${Number(h.id)})">Edit</button>
        <button class="btn btn-secondary btn-sm" onclick="delHook(${Number(h.id)})">Delete</button>
      </div>`;
    }).join('') : 'No cloud hooks yet.';
  }

  async function editHook(id) {
    const db = await Cloud.db();
    const h = (await db.collection('hooks').doc(String(id)).get()).data();
    if (!h) return;
    editingId = id;
    $('form-title').textContent = 'Edit hook #' + id;
    $('btn-save').textContent = 'Save changes';
    $('f-hook').value = h.hook;
    $('f-tags').value = Array.isArray(h.tags) ? h.tags.join(', ') : (h.tags || h.niche || '');
    $('f-views').value = h.views || '';
    $('f-instagram').value = h.exampleInstagram || '';
    $('f-howto').value = h.howTo || '';
    $('f-desc').value = h.description || '';
    $('f-caption').value = h.suggestedCaption || '';
    if ($('f-aiprompt')) $('f-aiprompt').value = h.aiPrompt || '';
    $('f-published').checked = !!h.published;
    setMsg('');
    $('hook-form').scrollIntoView({ behavior: 'smooth' });
  }

  async function delHook(id) {
    if (!confirm('Delete this hook?')) return;
    const db = await Cloud.db();
    await db.collection('hooks').doc(String(id)).delete();
    loadList();
  }

  async function loadStaff() {
    const db = await Cloud.db();
    const snap = await db.collection('staff').get();
    $('staff-list').innerHTML = snap.docs.map(d => `<div class="row"><div class="grow">${esc(d.id)}</div><button class="btn btn-secondary btn-sm" onclick="rmStaff('${esc(d.id)}')">Remove</button></div>`).join('') || '<span class="muted">No VAs yet.</span>';
  }
  async function addStaff(e) {
    e.preventDefault();
    const email = $('staff-email').value.trim().toLowerCase();
    const db = await Cloud.db();
    await db.collection('staff').doc(email).set({ addedAt: Date.now(), addedBy: firebase.auth().currentUser.email });
    $('staff-email').value = ''; loadStaff();
  }
  async function rmStaff(email) {
    const db = await Cloud.db();
    await db.collection('staff').doc(email).delete(); loadStaff();
  }

  document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
